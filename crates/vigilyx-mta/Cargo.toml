[package]
name = "vigilyx-mta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Vigilyx MTA 代理 — SMTP 中继 + 内嵌安全引擎"

[lib]
# This crate currently exposes module-level docs only; running rustdoc tests in the
# workspace triggers an unrelated dependency-resolution failure and blocks backend deploys.
doctest = false

[[bin]]
name = "vigilyx-mta"
path = "src/main.rs"
# Criterion benches do not need the production binary; compiling it under
# cargo bench triggers an unnecessary fat-LTO release link that dominates runtime.
bench = false

[[bench]]
name = "mta_perf"
harness = false

[dependencies]
vigilyx-core = { path = "../vigilyx-core" }
vigilyx-parser = { path = "../vigilyx-parser" }
vigilyx-db = { path = "../vigilyx-db" }
vigilyx-engine = { path = "../vigilyx-engine" }
vigilyx-soar = { path = "../vigilyx-soar" }

# Async runtime
tokio.workspace = true

# TLS
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rustls-webpki.workspace = true  # RUSTSEC-2026-0049: pin minimum safe version

# DB (load UI settings from the database)
sqlx.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true

# Time
chrono.workspace = true

# UUID
uuid.workspace = true

# Zero-copy byte buffers
bytes = "1.12.1"

# CLI arguments
clap = { version = "4", features = ["derive"] }

# .env
dotenvy.workspace = true

# Redis (MQ)
redis.workspace = true

# SMTP relay (downstream MTA)
lettre.workspace = true

# Async stream (Redis PubSub subscription)
futures = "0.3"

# HTTP client (MTA status reporting to the API)
reqwest = { version = "0.13", features = ["json"] }

# DNS resolver for the MTA-owned SPF/DMARC boundary
hickory-resolver = { version = "0.26.1", features = ["tokio"] }

[dev-dependencies]
criterion = "0.8"

[lints]
workspace = true
