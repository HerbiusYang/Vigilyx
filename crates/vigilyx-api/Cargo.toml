[package]
name = "vigilyx-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Vigilyx Web API 服务"

[[bin]]
name = "vigilyx-api"
path = "src/main.rs"

[dependencies]
vigilyx-core = { path = "../vigilyx-core" }
vigilyx-db = { path = "../vigilyx-db" }
vigilyx-engine = { path = "../vigilyx-engine" }
vigilyx-mta = { path = "../vigilyx-mta" }
vigilyx-parser = { path = "../vigilyx-parser" }
vigilyx-soar = { path = "../vigilyx-soar" }

# Async runtime
tokio.workspace = true

# Web framework
axum.workspace = true
tower-http.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
html-escape = "0.2.15"

# Database
sqlx.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true

# Time
chrono.workspace = true

# UUID
uuid.workspace = true

# WebSocket
futures = "0.3.34"

# Authentication
# Use aws-lc-rs for JWT signing/verification; the rust_crypto backend pulls in
# rsa 0.9, which has no fixed constant-time implementation for RUSTSEC-2023-0071.
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
argon2 = "0.5"

# Security: constant-time comparison (prevents timing attacks)
subtle = "2"
# SEC-M01: hash before constant-time comparison (eliminates length side channels)
sha2 = "0.11"
# SEC-REMAINING-004: protect sensitive data in memory (zeroize on drop + masked Debug)
secrecy = { version = "0.10", features = ["serde"] }
base64 = "0.23"
getrandom = "0.4"

# Per-IP login rate limiting (lock-free concurrent HashMap)
dashmap = "6.2"

# HTTP client (proxy requests to the Python AI service)
reqwest = { version = "0.13", features = ["json"] }

# System metrics
sysinfo = "0.39"

# Prometheus metric export
prometheus = "0.14"

# Match the engine's non-crypto YARA-X feature set. In particular, do not
# re-enable the vulnerable `rsa` dependency through feature unification.
yara-x = { version = "1.23.0", default-features = false, features = [
    "constant-folding",
    "elf-module",
    "exact-atoms",
    "fast-regexp",
    "hash-module",
    "lnk-module",
    "math-module",
    "string-module",
    "time-module",
    "zip-module",
] }

# SEC-NEW-001: SSRF URL parsing (instead of substring matching)
url = "2"
regex = "1"

[dev-dependencies]
# ServiceExt::oneshot for in-process middleware/router tests
tower = { version = "0.5", features = ["util"] }
proptest = "1.11"

[lints]
workspace = true
