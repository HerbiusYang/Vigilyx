[project]
name = "vigilyx-ai"
version = "0.9.3"
description = "Vigilyx AI 分析模块 - NLP 钓鱼检测 + 邮件威胁分析"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "Vigilyx Team"}
]
keywords = ["email-security", "phishing-detection", "nlp", "threat-analysis"]
dependencies = [
    "redis==8.1.0",
    "pydantic==2.13.4",          # Current stable Pydantic 2 release
    "httpx==0.28.1",
    "anthropic==0.122.0",        # Claude API
    "openai==3.0.0",              # OpenAI API (可选)
    "fastapi==0.141.1",          # HTTP API 服务; resolves to fixed Starlette 1.x
    "uvicorn==0.52.3",           # ASGI 服务器
    "structlog==26.1.0",         # 结构化日志
    "playwright==1.62.0",        # VT 页面抓取 (无头浏览器)
    "transformers==5.15.0",      # HuggingFace Transformer (NLP 钓鱼检测)
    "torch==2.13.0",             # PyTorch inference/training backend
    "peft==0.20.0",              # LoRA 参数高效微调
    "accelerate==1.14.0",        # HuggingFace Trainer + PEFT 依赖
    "sentencepiece==0.2.2",      # DeBERTa tokenizer 依赖
    "numpy<2.0",                 # Keep the validated NumPy 1.x ABI for existing model artifacts
    "scikit-learn==1.7.2",       # Latest fixed release retaining Python 3.10 support
    "psutil==7.2.2",             # 系统资源检测 (内存大小自适应训练参数)
]

[project.urls]
Homepage = "https://github.com/HerbiusYang/Vigilyx"
Repository = "https://github.com/HerbiusYang/Vigilyx"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
    "mypy==2.3.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests (no ML models)",
    "integration: tests requiring model loading or network",
]

[tool.mypy]
python_version = "3.10"
strict = true
