[workspace]
resolver = "2"
members = [
    "crates/vigilyx-core",
    "crates/vigilyx-parser",
    "crates/vigilyx-db",
    "crates/vigilyx-sniffer",
    "crates/vigilyx-api",
    "crates/vigilyx-engine",
    "crates/vigilyx-soar",
    "crates/vigilyx-mta",
]

[workspace.package]
version = "0.9.4"
edition = "2024"
rust-version = "1.97.1"
authors = ["Vigilyx Open Source Team"]
license = "AGPL-3.0-only"
description = "Real-time email threat detection platform with passive network capture and Dempster-Shafer evidence fusion"
repository = "https://github.com/HerbiusYang/Vigilyx"
homepage = "https://github.com/HerbiusYang/Vigilyx"
keywords = ["email-security", "threat-detection", "phishing", "network-capture", "dempster-shafer"]
categories = ["network-programming", "command-line-utilities"]

# Workspace-level lint configuration
# Rust 1.94 added a doc-formatting lint, and the current codebase still has many non-compliant blank-line patterns.
# These are purely documentation-formatting issues and do not affect correctness or security.
[workspace.lints.clippy]
doc_lazy_continuation = "allow"
empty_line_after_doc_comments = "allow"
empty_line_after_outer_attr = "allow"

[workspace.dependencies]
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Async runtime
tokio = { version = "1.53.1", features = ["full", "test-util"] }

# Time handling
chrono = { version = "0.4.45", features = ["serde"] }

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Environment variables
dotenvy = "0.15"

# Network capture
pnet = "0.35"

# Web framework
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "set-header"] }

# Database
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros"] }

# UUID
uuid = { version = "1.24.0", features = ["v4", "serde"] }

# Redis message queue
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager"] }

# Async channels
async-channel = "2.5"

# Mail sending
lettre = { version = "0.11.23", features = ["tokio1-native-tls", "builder", "smtp-transport"] }

# Graph algorithms (DAG orchestration)
petgraph = "0.8"

# CPU core detection
num_cpus = "1.17"

# Data parallelism (rayon)
rayon = "1.12"

# High-performance hashing (FxHash: non-cryptographic, 5-8x faster than SipHash)
rustc-hash = "2"

# Image decoding (multi-format: JPEG, PNG, GIF, BMP, WebP, TIFF)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }

# Security: pinned minimum versions to fix known vulnerabilities
# RUSTSEC-2026-0049/0098/0099/0104: pin the patched 0.103 line.
rustls-webpki = "0.103.14"
# RUSTSEC-2026-0097: rand unsoundness (fixed in 0.9.3)
rand = ">=0.9.3"

# ============================================
# Performance tuning
# ============================================

[profile.release]
lto = "fat"                           # Link-time optimization (max performance)
codegen-units = 1                     # Single codegen unit (better optimization)
# panic = "abort" is intentionally NOT set: a long-running security service must
# not abort the whole process because a single malicious input panicked one
# detection module. Panics unwind and are contained per module (see
# crates/vigilyx-engine/src/pipeline/orchestrator.rs catch_unwind).
opt-level = 3                         # Highest optimization level
strip = true                          # Strip symbol tables

[profile.release.build-override]
opt-level = 3

# Fast release: quick builds with acceptable runtime performance (for day-to-day development)
# Usage: cargo build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = "thin"                          # Thin LTO: much faster compilation, slightly lower performance
codegen-units = 16                    # Multi-core parallel code generation
strip = false                         # Skip strip to save time
incremental = true                    # Incremental compilation (do not rebuild everything for one-line changes)

# Benchmark profile: keep high optimization, but avoid fat-LTO / single-codegen-unit
# compile times overwhelming iterative performance measurements.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

# Enable some optimization in dev builds too
[profile.dev]
opt-level = 1                         # Enable basic optimization in dev builds

[profile.dev.package."*"]
opt-level = 2                         # Apply higher optimization to dependencies
